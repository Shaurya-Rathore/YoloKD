
# Parameters
nc: 6 # number of classes
depth_multiple: 0.33  # scales module repeats
width_multiple: 0.5  # scales convolution channels

# YOLOv8.0n backbone with TemplateBank and SConv2d
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]]
  - [-1, 1, TemplateBank, [3, 256, 256, 3]] # Using TemplateBank with 3 templates
  - [-1, 6, SConv2d, [TemplateBank, 1, 1]] # Replace Conv with SConv2d
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, SConv2d, [TemplateBank, 1,1]] # Add soft sharing
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, SConv2d, [TemplateBank,1,1]] # Add soft sharing
  - [-1, 1, SPPF, [1024, 5]] # 9

# YOLOv8.0n head with TemplateBank and SConv2d
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 3, SConv2d, [bank=TemplateBank, stride=1, padding=1]] # Replace Conv with SConv2d for P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 3, SConv2d, [bank=TemplateBank, stride=1, padding=1]] # Replace Conv with SConv2d for P3

  - [-1, 1, SConv2d, [bank=TemplateBank, stride=1, padding=1]]
  - [[-1, 12], 1, Concat, [1]] # cat head P4
  - [-1, 3, SConv2d, [bank=TemplateBank, stride=1, padding=1]] # Replace Conv with SConv2d for P4

  - [-1, 1, SConv2d, [bank=TemplateBank, stride=1, padding=1]]
  - [[-1, 9], 1, Concat, [1]] # cat head P5
  - [-1, 3, SConv2d, [bank=TemplateBank, stride=1, padding=1]] # Replace Conv with SConv2d for P5

  - [[15, 18, 21], 1, Detect, [nc]] # Detect(P3, P4, P5)
